<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="css/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="music-player">
            <div class="player-header">
                <h1>音乐播放器</h1>
                <div class="category-nav">
                    <button class="active">全部</button>
                    <button>流行</button>
                    <button>摇滚</button>
                    <button>民谣</button>
                </div>
            </div>
            
            <div class="player-main">
                <div class="now-playing">
                    <div class="album-art">
                        <img src="https://picsum.photos/300/300" alt="专辑封面">
                        <div class="vinyl-effect"></div>
                    </div>
                    <div class="track-info">
                        <h2 class="track-name">歌曲名称</h2>
                        <p class="artist-name">艺术家</p>
                    </div>
                </div>
                
                <div class="controls">
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress"></div>
                        </div>
                        <div class="time">
                            <span class="current-time">0:00</span>
                            <span class="duration">0:00</span>
                        </div>
                    </div>
                    
                    <div class="buttons">
                        <button class="shuffle"><i class="ri-shuffle-line"></i></button>
                        <button class="prev"><i class="ri-skip-back-fill"></i></button>
                        <button class="play-pause"><i class="ri-play-fill"></i></button>
                        <button class="next"><i class="ri-skip-forward-fill"></i></button>
                        <button class="repeat"><i class="ri-repeat-line"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="playlist">
                <h3>播放列表</h3>
                <ul class="track-list">
                    <!-- 歌曲列表将通过JavaScript动态生成 -->
                </ul>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
